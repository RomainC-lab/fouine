# Tests à chaque changement (Windows et Linux), fabrication de Fouine.exe,
# et publication d'une Release quand on pose un tag « v… ».
name: Fouine

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Par défaut, aucune tâche ne peut écrire dans le dépôt.
permissions:
  contents: read

concurrency:
  group: fouine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les bibliothèques
        run: python -m pip install -r requirements.txt
      - name: Tests (faux modèles, rien n'est téléchargé)
        run: python -m unittest discover -s tests -t . -v
      - name: Auto-test depuis le code
        run: python -m fouine --autotest

  exe:
    name: Fouine.exe (Windows)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: emballage/requirements-exe.txt
      - name: Installer les bibliothèques (versions exactes) et PyInstaller
        run: python -m pip install -r emballage/requirements-exe.txt
      - name: Fabriquer Fouine.exe
        run: pyinstaller --noconfirm --clean emballage/Fouine.spec
      - name: Vérifier le numéro de version
        shell: pwsh
        run: |
          $version = (python -c "import fouine; print(fouine.__version__)").Trim()
          $sortie = (& dist\Fouine\Fouine.exe --version | Out-String).Trim()
          Write-Host "Fouine.exe --version : $sortie"
          if ($LASTEXITCODE -ne 0 -or $sortie -ne "Fouine $version") { throw "numéro de version inattendu" }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "le tag $env:GITHUB_REF_NAME ne correspond pas à la version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Auto-test de Fouine.exe (sans réseau, sans Python)
        shell: pwsh
        run: |
          # Fouine.exe est lancé depuis un autre dossier, sans Python dans le PATH :
          # il ne doit compter que sur ce qui est dans son propre dossier.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = $null; $env:PYTHONPATH = $null
          Copy-Item -Recurse dist\Fouine "$env:RUNNER_TEMP\Fouine essai"
          Set-Location $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP\Fouine essai\Fouine.exe" --autotest
          if ($LASTEXITCODE -ne 0) { throw "l'auto-test de Fouine.exe a échoué (code $LASTEXITCODE)" }
      - name: Contenu du paquet
        shell: pwsh
        run: |
          $fichiers = Get-ChildItem -Recurse -File dist\Fouine
          "{0} fichiers, {1:N0} Mo" -f $fichiers.Count, (($fichiers | Measure-Object Length -Sum).Sum / 1MB)
          "Bibliothèques Microsoft (Visual C++) embarquées :"
          $vc = $fichiers | Where-Object { $_.Name -match "^(msvcp|vcruntime|concrt)" }
          $vc | ForEach-Object { "  " + $_.FullName.Substring((Resolve-Path dist).Path.Length + 1) }
          foreach ($nom in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            if (-not ($vc | Where-Object { $_.Name -ieq $nom })) { throw "$nom n'est pas dans le paquet : Fouine.exe ne démarrerait pas sur un PC qui ne l'a pas" }
          }
          $modeles = $fichiers | Where-Object { $_.Length -gt 60MB }
          if ($modeles) { $modeles | ForEach-Object { $_.FullName }; throw "un très gros fichier est dans le paquet : un modèle embarqué par erreur ?" }
      - name: Zip et empreinte SHA-256
        shell: pwsh
        run: |
          $zip = "Fouine-$env:VERSION-windows.zip"
          Compress-Archive -Path dist\Fouine -DestinationPath $zip
          $empreinte = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$empreinte  $zip" | Out-File -Encoding ascii "$zip.sha256"
          Get-Content "$zip.sha256"
          "{0:N0} Mo" -f ((Get-Item $zip).Length / 1MB)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fouine-windows
          path: |
            Fouine-*-windows.zip
            Fouine-*-windows.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publier la Release
    if: github.ref_type == 'tag'
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write # seule tâche qui écrit : elle crée la Release et y dépose le zip
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fouine-windows
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check Fouine-*-windows.zip.sha256
          {
            echo "Programme Windows tout fait : téléchargez le fichier \`.zip\` ci-dessous, décompressez-le, puis double-cliquez sur \`Fouine.exe\` dans le dossier \`Fouine\`. Rien d'autre à installer."
            echo
            echo "Au premier lancement, Windows affiche sans doute « Windows a protégé votre ordinateur » : cliquez sur « Informations complémentaires », puis « Exécuter quand même » (Fouine n'est pas signé). Pour arrêter Fouine, fermez la fenêtre noire."
            echo
            echo "Mode d'emploi : https://github.com/${GH_REPO}#readme"
            echo
            echo "Empreinte SHA-256 du zip :"
            echo
            echo '```'
            cat Fouine-*-windows.zip.sha256
            echo '```'
            echo
            echo "Fabriqué par GitHub Actions à partir du code de ce tag ; \`Fouine.exe --version\` et \`Fouine.exe --autotest\` y ont réussi avant publication."
          } > notes.md
          gh release create "$TAG" Fouine-*-windows.zip Fouine-*-windows.zip.sha256 --title "Fouine ${TAG#v}" --notes-file notes.md --verify-tag
