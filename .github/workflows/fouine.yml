# Tests à chaque changement (Windows et Linux), fabrication de Fouine.exe et de son
# installateur, essais sur la machine Windows de GitHub (la vraie fenêtre est ouverte,
# l'installateur est lancé puis désinstallé), et publication d'une Release quand on pose
# un tag « v… ».
name: Fouine

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Par défaut, aucune tâche ne peut écrire dans le dépôt.
permissions:
  contents: read

concurrency:
  group: fouine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les bibliothèques
        run: python -m pip install -r requirements.txt
      - name: Tests (faux modèles, rien n'est téléchargé)
        run: python -m unittest discover -s tests -t . -v
      - name: Auto-test depuis le code
        run: python -m fouine --autotest

  exe:
    name: Fouine.exe et installateur (Windows)
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: emballage/requirements-exe.txt
      - name: Installer les bibliothèques (versions exactes) et PyInstaller
        run: python -m pip install -r emballage/requirements-exe.txt
      - name: Fabriquer Fouine.exe
        run: pyinstaller --noconfirm --clean emballage/Fouine.spec
      - name: Vérifier le numéro de version
        shell: pwsh
        run: |
          . emballage\essais.ps1
          $version = (python -c "import fouine; print(fouine.__version__)").Trim()
          $essai = Lancer-Fouine "dist\Fouine\Fouine.exe" @("--version")
          Write-Host "Fouine.exe --version : $($essai.Sortie) (code $($essai.Code))"
          if ($essai.Code -ne 0 -or $essai.Sortie -ne "Fouine $version") { throw "numéro de version inattendu" }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "le tag $env:GITHUB_REF_NAME ne correspond pas à la version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Fouine.exe n'ouvre pas de fenêtre noire
        shell: pwsh
        run: |
          # Octet « Subsystem » de l'en-tête du programme : 2 = fenêtré, 3 = console.
          $octets = [System.IO.File]::ReadAllBytes("dist\Fouine\Fouine.exe")
          $entete = [System.BitConverter]::ToInt32($octets, 0x3C)
          $genre = [System.BitConverter]::ToUInt16($octets, $entete + 24 + 68)
          Write-Host "Sous-système de Fouine.exe : $genre (2 = programme à fenêtre, 3 = programme à console)"
          if ($genre -ne 2) { throw "Fouine.exe ouvrirait une fenêtre noire" }
      - name: Auto-test de Fouine.exe (sans réseau, sans Python)
        shell: pwsh
        run: |
          . emballage\essais.ps1
          # Fouine.exe est lancé depuis un autre dossier, sans Python dans le PATH :
          # il ne doit compter que sur ce qui est dans son propre dossier.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = $null; $env:PYTHONPATH = $null
          Copy-Item -Recurse dist\Fouine "$env:RUNNER_TEMP\Fouine essai"
          Set-Location $env:RUNNER_TEMP
          $essai = Lancer-Fouine "$env:RUNNER_TEMP\Fouine essai\Fouine.exe" @("--autotest") 300
          Write-Host $essai.Sortie
          Write-Host $essai.Erreurs
          if ($essai.Code -ne 0 -or $essai.Sortie -notmatch "Auto-test réussi") { throw "l'auto-test de Fouine.exe a échoué (code $($essai.Code))" }
      - name: WebView2 est-il sur cette machine ?
        shell: pwsh
        run: |
          # Le moteur d'affichage de la fenêtre. Windows 11 l'a d'origine.
          $cle = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $version = $null
          foreach ($racine in "HKLM:\SOFTWARE\WOW6432Node", "HKLM:\SOFTWARE", "HKCU:\SOFTWARE") {
            $valeur = (Get-ItemProperty "$racine\Microsoft\EdgeUpdate\Clients\$cle" -ErrorAction SilentlyContinue).pv
            if ($valeur -and $valeur -ne "0.0.0.0") { $version = $valeur; Write-Host "WebView2 $valeur trouvé sous $racine" }
          }
          Write-Host ((Get-CimInstance Win32_OperatingSystem).Caption)
          if (-not $version) { Write-Host "::warning::WebView2 est absent de cette machine : l'essai de la fenêtre va le dire." }
      - name: Essai de la vraie fenêtre (ouverte, vérifiée, refermée)
        shell: pwsh
        run: |
          . emballage\essais.ps1
          # Même précaution que pour l'auto-test : le programme copié ailleurs, sans Python autour.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = $null; $env:PYTHONPATH = $null
          $donnees = "$env:RUNNER_TEMP\donnees essai"
          $capture = "$env:RUNNER_TEMP\fenetre-windows.png"
          $essai = Lancer-Fouine "$env:RUNNER_TEMP\Fouine essai\Fouine.exe" @("--essai-fenetre", "--donnees", $donnees, "--capture", $capture) 240
          Write-Host $essai.Sortie
          Write-Host $essai.Erreurs
          Montrer-Journal $donnees
          if ($essai.Code -ne 0 -or $essai.Sortie -notmatch "Essai réussi") { throw "l'essai de la fenêtre a échoué (code $($essai.Code))" }
          if (Test-Path "$donnees\instance.json") { throw "Fouine n'a pas rangé son annonce en s'arrêtant" }
      - name: Contenu du paquet
        shell: pwsh
        run: |
          $fichiers = Get-ChildItem -Recurse -File dist\Fouine
          "{0} fichiers, {1:N0} Mo" -f $fichiers.Count, (($fichiers | Measure-Object Length -Sum).Sum / 1MB)
          "Bibliothèques Microsoft (Visual C++) embarquées :"
          $vc = $fichiers | Where-Object { $_.Name -match "^(msvcp|vcruntime|concrt)" }
          $vc | ForEach-Object { "  " + $_.FullName.Substring((Resolve-Path dist).Path.Length + 1) }
          foreach ($nom in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            if (-not ($vc | Where-Object { $_.Name -ieq $nom })) { throw "$nom n'est pas dans le paquet : Fouine.exe ne démarrerait pas sur un PC qui ne l'a pas" }
          }
          "Ce que la fenêtre ajoute au paquet :"
          $fenetre = $fichiers | Where-Object { $_.FullName -match "\\(webview|pythonnet|clr_loader)\\" -or $_.Name -match "^(Python\.Runtime|ClrLoader)" }
          "  {0} fichiers, {1:N1} Mo" -f $fenetre.Count, (($fenetre | Measure-Object Length -Sum).Sum / 1MB)
          foreach ($nom in "Microsoft.Web.WebView2.Core.dll", "Microsoft.Web.WebView2.WinForms.dll", "WebView2Loader.dll", "Python.Runtime.dll") {
            if (-not ($fichiers | Where-Object { $_.Name -ieq $nom })) { throw "$nom n'est pas dans le paquet : la fenêtre ne s'ouvrirait pas" }
          }
          $modeles = $fichiers | Where-Object { $_.Length -gt 60MB }
          if ($modeles) { $modeles | ForEach-Object { $_.FullName }; throw "un très gros fichier est dans le paquet : un modèle embarqué par erreur ?" }
      - name: Zip portable et empreinte SHA-256
        shell: pwsh
        run: |
          $zip = "Fouine-$env:VERSION-windows.zip"
          Compress-Archive -Path dist\Fouine -DestinationPath $zip
          $empreinte = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$empreinte  $zip" | Out-File -Encoding ascii "$zip.sha256"
          Get-Content "$zip.sha256"
          "{0:N0} Mo" -f ((Get-Item $zip).Length / 1MB)
      - name: Fabriquer l'installateur (Inno Setup)
        shell: pwsh
        run: |
          # Inno Setup est déjà sur les machines Windows de GitHub ; rien n'est téléchargé.
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC.exe) n'est pas sur cette machine" }
          & $iscc "/DVersion=$env:VERSION" /Qp emballage\Fouine.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué (code $LASTEXITCODE)" }
          $installateur = "Fouine-$env:VERSION-installation.exe"
          $empreinte = (Get-FileHash $installateur -Algorithm SHA256).Hash.ToLower()
          "$empreinte  $installateur" | Out-File -Encoding ascii "$installateur.sha256"
          Get-Content "$installateur.sha256"
          "{0:N1} Mo" -f ((Get-Item $installateur).Length / 1MB)
      - name: Essai de l'installateur (installation, raccourcis, lancement, désinstallation)
        shell: pwsh
        run: |
          . emballage\essais.ps1
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = $null; $env:PYTHONPATH = $null
          $installateur = (Resolve-Path "Fouine-$env:VERSION-installation.exe").Path
          $dossier = "$env:LOCALAPPDATA\Programs\Fouine"
          $exe = "$dossier\Fouine.exe"
          $bureau = Join-Path ([Environment]::GetFolderPath("Desktop")) "Fouine.lnk"
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "Fouine.lnk"
          $registre = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6B0F1C0E-6E0B-4B6C-9C1F-F0A1E5D2B7A4}_is1"
          if (Test-Path $dossier) { throw "Fouine est déjà installé sur cette machine ?" }

          "--- installation silencieuse, pour l'utilisateur seul"
          $installation = Start-Process $installateur -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/LOG=`"$env:RUNNER_TEMP\installation.log`"" -Wait -PassThru
          if ($installation.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\installation.log" -Tail 40; throw "l'installation a échoué (code $($installation.ExitCode))" }
          if (-not (Test-Path $exe)) { throw "$exe n'existe pas après l'installation" }
          "installé dans $dossier"
          foreach ($raccourci in $bureau, $menu) {
            if (-not (Test-Path $raccourci)) { throw "raccourci absent : $raccourci" }
            $cible = Cible-Raccourci $raccourci
            "raccourci $raccourci -> $cible"
            if ($cible -ne $exe) { throw "le raccourci ne pointe pas sur Fouine.exe" }
          }
          $fiche = Get-ItemProperty $registre
          "paramètres Windows : « $($fiche.DisplayName) » $($fiche.DisplayVersion), désinstallation : $($fiche.QuietUninstallString)"
          if ($fiche.DisplayName -ne "Fouine" -or $fiche.DisplayVersion -ne $env:VERSION) { throw "fiche de désinstallation inattendue" }
          if (Test-Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6B0F1C0E-6E0B-4B6C-9C1F-F0A1E5D2B7A4}_is1") { throw "installé pour toute la machine : des droits d'administrateur ont servi" }

          "--- le programme installé"
          $essai = Lancer-Fouine $exe @("--version")
          "Fouine.exe --version (installé) : $($essai.Sortie) (code $($essai.Code))"
          if ($essai.Code -ne 0 -or $essai.Sortie -ne "Fouine $env:VERSION") { throw "numéro de version inattendu" }
          $donnees = "$env:RUNNER_TEMP\donnees installe"
          $essai = Lancer-Fouine $exe @("--essai-fenetre", "--donnees", $donnees) 240
          Write-Host $essai.Sortie
          if ($essai.Code -ne 0 -or $essai.Sortie -notmatch "Essai réussi") { Montrer-Journal $donnees; throw "la fenêtre du programme installé ne s'ouvre pas (code $($essai.Code))" }

          "--- désinstallation silencieuse : les données doivent rester"
          $temoin = "$env:LOCALAPPDATA\Fouine\temoin.txt"
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Fouine" | Out-Null
          "index de l'utilisateur" | Out-File $temoin
          $desinstallation = Start-Process "$dossier\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($desinstallation.ExitCode -ne 0) { throw "la désinstallation a échoué (code $($desinstallation.ExitCode))" }
          # Le désinstallateur se recopie ailleurs pour pouvoir s'effacer : on lui laisse le temps de finir.
          foreach ($essai in 1..60) { if (-not (Test-Path $dossier)) { break }; Start-Sleep -Seconds 1 }
          foreach ($reste in $dossier, $bureau, $menu, $registre) {
            if (Test-Path $reste) { Get-ChildItem -Recurse $reste -ErrorAction SilentlyContinue | Select-Object -First 20 FullName; throw "encore là après la désinstallation : $reste" }
          }
          if (-not (Test-Path $temoin)) { throw "la désinstallation a supprimé les données de l'utilisateur" }
          "désinstallé : programme, raccourcis et fiche Windows retirés ; les données ($env:LOCALAPPDATA\Fouine) sont gardées"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fouine-windows
          path: |
            Fouine-*-windows.zip
            Fouine-*-windows.zip.sha256
            Fouine-*-installation.exe
            Fouine-*-installation.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Garder la capture d'écran de la fenêtre
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fenetre-windows
          path: ${{ runner.temp }}/fenetre-windows.png
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publier la Release
    if: github.ref_type == 'tag'
    needs: exe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # seule tâche qui écrit : elle crée la Release et y dépose les fichiers
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fouine-windows
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check Fouine-*-windows.zip.sha256 Fouine-*-installation.exe.sha256
          {
            echo "**Le plus simple** : téléchargez \`Fouine-${TAG#v}-installation.exe\` ci-dessous et lancez-le. Il installe Fouine pour vous seul (aucun droit d'administrateur demandé) et pose une icône sur le Bureau et dans le menu Démarrer. Fouine s'ouvre ensuite dans sa propre fenêtre, sans navigateur ni fenêtre noire."
            echo
            echo "Au premier lancement de l'installateur, Windows affiche sans doute « Windows a protégé votre ordinateur » : cliquez sur « Informations complémentaires », puis « Exécuter quand même » (Fouine n'est pas signé)."
            echo
            echo "**Sans installation** : téléchargez \`Fouine-${TAG#v}-windows.zip\`, décompressez-le, puis double-cliquez sur \`Fouine.exe\` dans le dossier \`Fouine\`."
            echo
            echo "Mode d'emploi : https://github.com/${GH_REPO}#readme"
            echo
            echo "Empreintes SHA-256 :"
            echo
            echo '```'
            cat Fouine-*-installation.exe.sha256 Fouine-*-windows.zip.sha256
            echo '```'
            echo
            echo "Fabriqué par GitHub Actions à partir du code de ce tag. Avant publication, sur une machine Windows de GitHub : \`Fouine.exe --version\` et \`--autotest\` ont réussi, la fenêtre a été réellement ouverte puis refermée, et l'installateur a été lancé (raccourcis vérifiés) puis désinstallé."
          } > notes.md
          gh release create "$TAG" Fouine-*-installation.exe Fouine-*-installation.exe.sha256 Fouine-*-windows.zip Fouine-*-windows.zip.sha256 --title "Fouine ${TAG#v}" --notes-file notes.md --verify-tag
